<title>BB3</title>
<style>
:root{--bg:#0a0612;box-sizing:border-box}

canvas{display:block;position:fixed;inset:0;width:100%;height:100%}

#grain{position:fixed;inset:-50%;pointer-events:none;z-index:3;opacity:.07;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");animation:g .6s steps(4) infinite}
@keyframes g{0%{transform:translate(0,0)}25%{transform:translate(-3%,2%)}50%{transform:translate(2%,-3%)}75%{transform:translate(-2%,-1%)}}
@media (prefers-reduced-motion:reduce){#grain{animation:none}}
#a{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));width:11px;height:11px;border-radius:50%;border:0;padding:0;background:rgba(255,215,140,.22);z-index:5;cursor:pointer}
#a:hover,#a:focus-visible{background:rgba(255,215,140,.7);outline:none}

 <div id="login"><div>Admin access</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
(function(){
const T=THREE, PI=Math.PI;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let renderer;
try{renderer=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'})}catch(e){document.getElementById('nogl').style.display='flex';return}
renderer.outputEncoding=T.sRGBEncoding;
renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
let pr=Math.min(devicePixelRatio||1,2);

const scene=new T.Scene();
scene.fog=new T.Fog(0x120818,40,240);
const cam=new T.PerspectiveCamera(40,1,.1,1000);

// ---- Sky dome (shared with environment map) ----
const skyMat=new T.ShaderMaterial({side:T.BackSide,depthWrite:false,fog:false,
 vertexShader:'varying vec3 p;void main(){p=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
 fragmentShader:`varying vec3 p;void main(){vec3 d=normalize(p);float h=d.y;
 vec3 am=vec3(.34,.13,.2),mid=vec3(.1,.04,.2),top=vec3(.008,.006,.03);
 vec3 c=mix(am,mid,smoothstep(0.,.2,h));c=mix(c,top,smoothstep(.14,.62,h));
 c+=vec3(1.,.55,.2)*pow(max(0.,1.-abs(h)*5.),3.)*.12*smoothstep(-.9,.2,d.z*-1.);
 if(h<0.)c=mix(am*.3,vec3(.01,.005,.02),smoothstep(0.,-.3,h));
 gl_FragColor=vec4(c,1.);}`});
const sky=new T.Mesh(new T.SphereGeometry(500,32,16),skyMat);scene.add(sky);
const envScene=new T.Scene();envScene.add(new T.Mesh(new T.SphereGeometry(100,32,16),skyMat));
const panel=new T.Mesh(new T.PlaneGeometry(60,30),new T.MeshBasicMaterial({color:0xffd28a}));
panel.position.set(30,40,50);panel.lookAt(0,0,0);envScene.add(panel);
const pm=new T.PMREMGenerator(renderer);
scene.environment=pm.fromScene(envScene,.03).texture;

// ---- Mountains ----
function mount(z,col,amp,seed){
 const s=new T.Shape();s.moveTo(-320,-6);
 for(let x=-320;x<=320;x+=4){const y=amp*(.55+.3*Math.sin(x*.017+seed)+.2*Math.sin(x*.043+seed*2)+.1*Math.sin(x*.11+seed*3));s.lineTo(x,y)}
 s.lineTo(320,-6);
 const m=new T.Mesh(new T.ShapeGeometry(s),new T.MeshBasicMaterial({color:col}));m.position.z=z;scene.add(m)}
mount(-150,0x2b1d40,15,1);mount(-105,0x1c1232,11,4);mount(-65,0x0e0818,7,8);

// ---- Ground + distant lights ----
const floor=new T.Mesh(new T.CircleGeometry(260,64),new T.MeshStandardMaterial({color:0x0f0805,metalness:.65,roughness:.4}));
floor.rotation.x=-PI/2;floor.receiveShadow=true;scene.add(floor);
{const n=170,pos=new Float32Array(n*3);
 for(let i=0;i<n;i++){const x=(Math.random()-.5)*300,z=-30-Math.random()*60;pos[i*3]=x;pos[i*3+1]=.3;pos[i*3+2]=z}
 const g=new T.BufferGeometry();g.setAttribute('position',new T.BufferAttribute(pos,3));
 scene.add(new T.Points(g,new T.PointsMaterial({color:0xffd9a0,size:.7,fog:true,transparent:true,opacity:.8})))}

// ---- Pedestal ----
const bronze=new T.MeshStandardMaterial({color:0x3b2310,metalness:.85,roughness:.38});
const goldBand=new T.MeshStandardMaterial({color:0xe3a93a,metalness:.95,roughness:.22});
const stack=new T.Group();scene.add(stack);
let y=3.0,w=9.0,d=3.7,i=0;
while(y>0.02){
 const band=i%2===0,h=band?.17:.55;const hh=Math.min(h,y);
 const m=new T.Mesh(new T.BoxGeometry(w,hh,d),band?goldBand:bronze);
 y-=hh;m.position.y=y+hh/2;m.castShadow=m.receiveShadow=true;stack.add(m);
 if(!band){w+=.5;d+=.45}i++;if(i>9)break}
if(y>0.02){const b=new T.Mesh(new T.BoxGeometry(w-.4,y,d-.4),bronze);b.position.y=y/2;b.castShadow=b.receiveShadow=true;stack.add(b)}

// ---- Monumental architecture behind the title ----
const stone=new T.MeshStandardMaterial({color:0x24150a,metalness:.8,roughness:.45});
[[22,3,3.6,0,1.5,-3.6],[15,11,3.2,0,5.5,-4],[9,19,3,0,9.5,-6.2],[2.4,13,2.4,-9.6,6.5,-3.2],[2.4,13,2.4,9.6,6.5,-3.2]].forEach(([w,h,d,x,y,z])=>{
 const b=new T.Mesh(new T.BoxGeometry(w,h,d),stone);b.position.set(x,y,z);b.castShadow=b.receiveShadow=true;scene.add(b);
 const g=new T.Mesh(new T.BoxGeometry(w+.25,.16,d+.25),goldBand);g.position.set(x,y+h/2,z);scene.add(g)});

// ---- BB3 letters (real extruded geometry, no font dependency) ----
const hole=(y0,y1)=>{const p=new T.Path();p.moveTo(.55,y0);p.lineTo(1,y0);p.absarc(1,(y0+y1)/2,(y1-y0)/2,-PI/2,PI/2,false);p.lineTo(.55,y1);p.lineTo(.55,y0);return p};
function shapeB(){const s=new T.Shape();s.moveTo(0,0);s.lineTo(1,0);s.absarc(1,.8,.8,-PI/2,PI/2,false);s.absarc(1,2.3,.7,-PI/2,PI/2,false);s.lineTo(0,3);s.lineTo(0,0);
 s.holes.push(hole(.45,1.15),hole(1.95,2.65));return[s]}
function ring(cx,cy,ro,ri,a0,a1){const s=new T.Shape();s.absarc(cx,cy,ro,a0,a1,true);s.absarc(cx,cy,ri,a1,a0,false);return s}
function shape3(){const bar=new T.Shape();bar.moveTo(.45,1.36);bar.lineTo(1,1.36);bar.lineTo(1,1.74);bar.lineTo(.45,1.74);bar.lineTo(.45,1.36);
 return[ring(.9,2.25,.75,.35,PI*.85,-PI/2),ring(.9,.8,.8,.4,PI/2,-PI*.85),bar]}
const gold=new T.MeshStandardMaterial({color:0xf2b83f,emissive:0x1c0e00,metalness:.92,roughness:.26});
const title=new T.Group();
[[shapeB(),0],[shapeB(),2.05],[shape3(),4.1]].forEach(([shapes,x])=>{
 shapes.forEach((s,k)=>{const g=new T.ExtrudeGeometry(s,{depth:2.2,bevelEnabled:true,bevelThickness:.07,bevelSize:.05,bevelSegments:2,curveSegments:28});
  g.translate(0,0,-1.1);const m=new T.Mesh(g,gold);m.position.set(x,0,k*.002);m.castShadow=m.receiveShadow=true;title.add(m)})});
title.scale.setScalar(1.3);title.position.set(-2.95*1.3,3.0,0);scene.add(title);

// ---- Lighting ----
scene.add(new T.HemisphereLight(0x4a3a78,0x1a0f08,.25));
const sun=new T.DirectionalLight(0xffb96a,1.7);sun.position.set(6,14,13);sun.target.position.set(0,3,0);
sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-14,right:14,top:14,bottom:-14,near:1,far:50});
sun.shadow.bias=-.0004;scene.add(sun,sun.target);

// ---- Spotlights: volumetric beams + glare ----
const glowTex=(()=>{const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d'),g=x.createRadialGradient(64,64,0,64,64,64);
 g.addColorStop(0,'rgba(255,245,220,1)');g.addColorStop(.25,'rgba(255,220,160,.45)');g.addColorStop(1,'rgba(255,200,120,0)');x.fillStyle=g;x.fillRect(0,0,128,128);return new T.CanvasTexture(c)})();
const beamGeo=new T.CylinderGeometry(4,.3,100,32,1,true);beamGeo.translate(0,50,0);
const beamMat=new T.ShaderMaterial({transparent:true,depthWrite:false,blending:T.AdditiveBlending,side:T.DoubleSide,fog:false,
 vertexShader:'varying vec3 n,v;varying vec2 u;void main(){u=uv;n=normalMatrix*normal;vec4 mv=modelViewMatrix*vec4(position,1.);v=-mv.xyz;gl_Position=projectionMatrix*mv;}',
 fragmentShader:'varying vec3 n,v;varying vec2 u;void main(){float f=abs(dot(normalize(n),normalize(v)));float a=pow(f,2.2)*pow(u.y,1.4)*.55*(1.-smoothstep(.75,1.,u.y)*0.0);gl_FragColor=vec4(vec3(.95,.85,.7)*a,a);}'});
const beams=[];
[[17,-8,-.14],[-18,-9,.14]].forEach(([x,z,r],k)=>{
 const b=new T.Mesh(beamGeo,beamMat);b.position.set(x,.3,z);b.rotation.z=r;b.userData={r,k};b.renderOrder=2;scene.add(b);beams.push(b);
 const s=new T.Sprite(new T.SpriteMaterial({map:glowTex,blending:T.AdditiveBlending,depthWrite:false,fog:false}));s.scale.set(5,5,1);s.position.set(x,.8,z);scene.add(s);
 const sl=new T.SpotLight(0xffd9a0,3.4,0,.5,1,0);sl.position.set(x,2,z+4);sl.target.position.set(0,5,0);scene.add(sl,sl.target)});

// ---- Camera sequence ----
const ease=t=>t*t*t*(t*(t*6-15)+10);
const DUR=14,START=.6;let k=1;
function resize(){const w=innerWidth,h=innerHeight;renderer.setPixelRatio(pr);renderer.setSize(w,h,false);cam.aspect=w/h;
 k=Math.max(1,10.8/(12.4*cam.aspect));cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
const P0=new T.Vector3(-4,7.6,6.6),L0=new T.Vector3(.4,6.5,0),L1=new T.Vector3(.2,3.6,0);
const tmp=new T.Vector3(),look=new T.Vector3();
function frame(t,time){
 const e=ease(Math.min(1,Math.max(0,t)));
 const P1=new T.Vector3(-3,3.7,17*k),s0=P0.clone();s0.z=6.6*Math.pow(k,.6);
 tmp.lerpVectors(s0,P1,e);look.lerpVectors(L0,L1,e);
 if(!reduce){tmp.x+=Math.sin(time*.35)*.08;tmp.y+=Math.sin(time*.27)*.05}
 cam.position.copy(tmp);cam.lookAt(look)}

// ---- Loop with adaptive resolution ----
const fade=document.getElementById('fade'),clock=new T.Clock();let acc=0,n=0,adapted=0;
let ended=false,stopped=false;window.__stop1=()=>{stopped=true;ended=true};function loop(){if(stopped)return;requestAnimationFrame(loop);
 const dt=clock.getDelta(),time=clock.elapsedTime;
 const t=reduce?1:(time-START)/DUR;frame(t,time);
 if(!ended)fade.style.opacity=reduce?0:Math.max(0,1-time/1.6);
 if(!ended&&time>(reduce?2.5:START+DUR+2.4)){ended=true;window.startPhase2&&window.startPhase2(()=>{stopped=true;renderer.domElement.style.display='none'})}
 if(!reduce)beams.forEach(b=>{b.rotation.z=b.userData.r+Math.sin(time*.22+b.userData.k*2)*.03});
 if(adapted<3&&time>2){acc+=dt;n++;if(n===90){if(acc/n>.024&&pr>.8){pr=Math.max(.75,pr*.75);resize()}adapted++;acc=n=0}}
 renderer.render(scene,cam)}
loop();

// ---- Hidden admin entry (prototype-only; real auth must be server-side) ----
const $=id=>document.getElementById(id),m=$('m');
$('a').onclick=()=>{m.classList.add('on');setTimeout(()=>$('pw').focus(),30)};
const close=()=>{m.classList.remove('on');$('pw').value='';$('err').textContent=''};
$('x').onclick=close;m.addEventListener('click',e=>{if(e.target===m)close()});
addEventListener('keydown',e=>{if(e.key==='Escape')close()});
async function tryLogin(){const b=$('go');b.disabled=true;try{const r=await fetch('/api/admin/login',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify({password:$('pw').value})});if(r.ok){location.href='/admin';return}$('err').textContent=r.status===429?'Too many attempts. Please try later.':'Incorrect password';$('pw').select()}catch(e){$('err').textContent='Server unreachable'}b.disabled=false}
$('go').onclick=tryLogin;$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')tryLogin()});
$('lock').onclick=()=>{$('panel').style.display='none';$('login').style.display='block';close()};
})();
</script>
<style>

(function(){

// Seven members, seven different companions (fixed mapping)

function add(type,layer,s){const d=ART[type],g=document.createElementNS(NS,'g');

function upd(c,t,dt){
 const hx=c.x+c.ox,hy=c.y-80*c.s;let dx=px-hx,dy=py-hy,d=Math.hypot(dx,dy),idle=!c.walk&&!c.carry;

 if(near&&!c.wasNear&&!c.shy&&d>0){c.hopT=.35;c.tox=d<110?-Math.sign(dx)*16:Math.sign(dx)*10}
 if(!near&&!c.shy)c.tox=0;c.wasNear=near;

 let lx=near?clamp(dx/120,-1,1):c.walk?c.face*.8:c.adm?clamp((CX-hx)/200,-1,1):Math.sin(t*.4+c.ph)*.5;
 let ly=near?clamp(dy/120,-1,1):idle&&Math.sin(t*.23+c.ph*3)>.65?.9:idle&&Math.sin(t*.31+c.ph)>.85?-.8:0;
 if(c.lo){lx=c.lo[0];ly=c.lo[1]}const k=Math.min(1,dt*8);c.lx+=(lx-c.lx)*k;c.ly+=(ly-c.ly)*k;

 if(c.walk){const w=Math.sin(t*(c.wf||11)+c.ph);bob=Math.abs(w)*3.5;a=w*3;l=Math.max(0,w)*5;r=Math.max(0,-w)*5}

function mkStick(){const g=document.createElementNS(NS,'g');g.innerHTML=`<g filter="url(#rough)" stroke="${INK}" stroke-width="1.8"><rect x="${-(S+30)/2}" y="-13" width="${S+30}" height="26" rx="7" fill="#f1dfbb"/><path d="M${-S/2} -4h90M${-S/2+40} 5h120M${S/2-130} -5h100M${S/2-70} 6h60" fill="none" stroke-width="1" opacity=".5"/></g>`;g.setAttribute('transform','translate(-999 -999)');LS.appendChild(g);const k={g,pair:null};sticks.push(k);return k}
async function deliver(lead,rear,dir,stick,row,fin){
 const p={lift:0,tilt:0};stick.pair={a:rear,b:lead,p};
 lead.carry=rear.carry=1;lead.walk=rear.walk=1;lead.face=rear.face=dir;lead.y=rear.y=row;

async function walkTo(c,x,y,ms){c.walk=1;c.face=x>c.x?1:-1;await tw(c,{x,y},ms||1800);c.walk=0;c.face=1}
async function story(){
 const por=H>W,top=CY-S/2,bot=CY+S/2,L=CX-S/2,R=CX+S/2;
 const fox=add('fox',LC),rab=add('rabbit',LC),cat=add('cat',LC),duck=add('duck',LC);
 [fox,rab,cat,duck].forEach(c=>{c.react=1;c.x=-300;c.y=CY});
 const st=[0,1,2,3].map(mkStick);
 duck.x=W+50;duck.y=CY+60;
 await sleep(900);await tw(duck,{x:W-26},1100);await sleep(800);await tw(duck,{x:W+46},500);await sleep(600);   // 1. the shy peek

 await Promise.all([walkTo(fox,...sp1[0]),walkTo(rab,...sp1[1]),walkTo(cat,...sp1[2]),walkTo(duck,R+60,bot-24)]);
 [fox,rab,cat].forEach(c=>c.adm=1);   // 5. admire the finished frame
 for(const c of [fox,rab,cat]){c.hopT=.35;spark(c.x,c.y-70,2);await sleep(260)}
 await sleep(500);LB.appendChild(duck.g);duck.shy=1;duck.post=R;duck.y=bot-26;duck.react=1;
 $('paper').setAttribute('opacity',1);$('fo').classList.add('on');
 if(!matchMedia('(pointer:coarse)').matches)setTimeout(()=>$('nm').focus(),900)}
let busy=0;
function say(txt,btn){return new Promise(async r=>{const s=$('say');s.innerHTML='<div class="bub"><span></span></div>';const sp=s.querySelector('span');
 if(reduce)sp.textContent=txt;else for(let i=1;i<=txt.length;i++){sp.textContent=txt.slice(0,i);await sleep(38)}

async function meet(m){busy=1;window.BB3={member:m[0],animal:m[1]};
 const a=$('ask');a.style.opacity=0;a.style.pointerEvents='none';await sleep(500);a.style.display='none';

 chars.forEach((c,i)=>{if(c!==guide&&!c.shy)setTimeout(()=>c.hopT=.35,i*120)});

function check(){if(busy)return;const k=$('nm').value.normalize('NFD').replace(/[\u0300-\u036f\s]/g,'').toLowerCase(),m=MEM[k];

function build(){const por=innerHeight>innerWidth*1.05;W=por?640:1000;H=por?1000:640;CX=W/2;CY=por?470:H/2;

 LB=$('LB');LC=$('LC');LS=$('LS');LG=$('LG');LP=$('LP');const st=$('st');

const MSG={locked:"You've already submitted! Your little journey is complete.",closed:"The invitation is closed right now, so I can't take your answers yet."};
